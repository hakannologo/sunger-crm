<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17594a">
  <title>Bağlantı yok · Sünger CRM</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f4f2ee; color: #1f2328; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kutu { text-align: center; padding: 24px; max-width: 340px; }
    .simge { width: 72px; height: 72px; border-radius: 18px; background: #17594a; color: #e9b44c;
             font: 700 44px/72px system-ui, sans-serif; margin: 0 auto 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #6b6f76; margin: 0 0 20px; }
    button { background: #17594a; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
             font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <div class="kutu">
    <div class="simge">S</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Sünger CRM'e ulaşılamıyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </div>
</body>
</html>
