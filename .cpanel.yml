# cPanel "Git Version Control" → "Deploy HEAD Commit" basılınca çalışır.
# Programı (app/), başlatıcıyı (cgi-bin/app.cgi) ve yönlendirme ayarını (.htaccess)
# sitenin klasörüne kopyalar. Veriler (crm-veri/) ve packages/ klasörüne dokunulmaz.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/koltuksungeri/crm.koltuksungeri.com/
    - /bin/mkdir -p ${DEPLOYPATH}cgi-bin
    - /bin/cp -R app ${DEPLOYPATH}
    - /bin/cp kurulum/app.cgi ${DEPLOYPATH}cgi-bin/app.cgi
    - /bin/chmod 755 ${DEPLOYPATH}cgi-bin/app.cgi
    - /bin/cp kurulum/htaccess ${DEPLOYPATH}.htaccess
